name: Villa Webcam Helper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run helper
        run: python capture.py
